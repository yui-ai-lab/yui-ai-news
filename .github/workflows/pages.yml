name: Deploy Yui AI News Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/**"
      - ".github/scripts/security_check.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yui-ai-news-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Include standalone calculator in public site
        run: |
          mkdir -p site/break-even
          cp -R apps/break-even/. site/break-even/

      - name: Scan public site for secrets and unsafe files
        run: python3 .github/scripts/security_check.py site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Allow Pages artifact metadata to become available
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
